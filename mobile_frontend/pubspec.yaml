name: vardigo
description: "Vardigo Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3
  get_it: ^8.0.3
  flutter_dotenv: ^5.2.1
  flutter_bloc: ^8.1.6
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.2
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/vardigo_icon_padded.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/vardigo_adaptive_fg.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/vardigo_icon_padded.png
  android_12:
    color: "#FFFFFF"
    image: assets/logos/vardigo_adaptive_fg.png
    icon_background_color: "#FFFFFF"
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: contain
  fullscreen: true
  android_screen_orientation: portrait

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/logos/
    - assets/photos/
    - .env
